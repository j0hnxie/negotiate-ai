<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Negotiation Copilot</title>
    <style>
      body {
        font: 13px/1.4 "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 12px;
        width: 280px;
        background: #f8fafc;
        color: #0f172a;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      p {
        margin: 0 0 10px;
        color: #475569;
      }

      button {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
        margin-bottom: 8px;
      }

      #toggleBtn {
        background: #0f766e;
        color: #ffffff;
        border-color: #0f766e;
      }

      #status {
        min-height: 18px;
        font-size: 12px;
        color: #334155;
      }
    </style>
  </head>
  <body>
    <h1>Negotiation Copilot</h1>
    <p id="blurb">Open a Google Meet tab to use live coaching.</p>
    <button id="toggleBtn" type="button" disabled>Pause coach</button>
    <button id="resetBtn" type="button" disabled>Reset transcript</button>
    <button id="settingsBtn" type="button">Open settings</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
